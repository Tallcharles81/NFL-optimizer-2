services:
  monitor:
    build: .
    image: pokemon-restock-monitor:latest
    container_name: pokemon-restock-monitor
    restart: unless-stopped          # restarts automatically after a crash or reboot
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/restock.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data             # database persists across restarts/rebuilds
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
