# Pokémon restock monitor on GitHub Actions: no always-on computer needed.
#
# Each run keeps re-checking every product about every 30 seconds for 20
# minutes, then queues the next run itself, so checking never stops. The
# 15-minute schedule is only a backup (GitHub's scheduler can be late or not
# fire at all). Only one run happens at a time.
#
# Off switch: set the repository variable MONITOR_ENABLED=false, or disable the
# workflow in the Actions tab. Any restock is verified with an independent
# re-check, then alerted (Discord and/or ntfy phone push) once, plus reminders
# while it stays in stock. State is kept on the `monitor-state` branch.
#
# Setup (repo Settings -> Secrets and variables -> Actions):
#   Secrets:   DISCORD_WEBHOOK_URL and/or NTFY_TOPIC   (at least one)
#              DISCORD_MENTION (optional, e.g. @here), CONTACT_EMAIL (optional)
#   TARGET_USE_BROWSER defaults to true (Target fills in stock status with
#   JavaScript). Set it to false as a variable or secret to use plain requests.
#
# Scheduled workflows only run from the default branch. GitHub may start runs a
# few minutes late when it is busy.

name: Pokémon restock monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification instead of checking stock"
        type: boolean
        default: false
      test_retailer:
        description: "With test_notification: which retailer's alert to imitate (target or walmart)"
        type: string
        default: "target"
      diagnose:
        description: "Diagnostics: capture product pages (no stock check)"
        type: boolean
        default: false
      live_test_tcins:
        description: "Live end-to-end test: comma-separated TCINs checked with a scratch database; alerts are labelled [SIMULATION]"
        type: string
        default: ""
      live_test_retailer:
        description: "With live_test_tcins: retailer of those IDs (target or walmart)"
        type: string
        default: "target"
      live_test_minutes:
        description: "With live_test_tcins: keep re-checking for this many minutes (0 = once)"
        type: string
        default: "0"
      diagnose_sku:
        description: "Product ID(s) to capture when diagnosing (Target TCIN or Walmart item ID; comma-separated)"
        type: string
        default: "1010892076"
      diagnose_retailer:
        description: "Retailer to diagnose (target or walmart)"
        type: string
        default: "target"

permissions:
  contents: write
  actions: write   # lets a finished run queue the next one

concurrency:
  # Test / diagnose runs get their own queue so they never delay or replace the
  # monitoring chain.
  group: ${{ (inputs.live_test_tcins || inputs.diagnose || inputs.test_notification) && 'pokemon-restock-monitor-tests' || 'pokemon-restock-monitor' }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: pokemon-restock-monitor
    env:
      DATABASE_URL: sqlite:///./data/restock.db
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL || 'unset@example.com' }}
      TARGET_USE_BROWSER: ${{ vars.TARGET_USE_BROWSER || secrets.TARGET_USE_BROWSER || 'true' }}
      TIMEZONE: ${{ vars.TIMEZONE || 'America/New_York' }}
      NOTIFY_CONSOLE: "true"
      # Only alert when Target / Walmart itself sells the item: marketplace sellers
      # (Target Plus, Walmart Marketplace) and unknown sellers never alert.
      ACCEPT_THIRD_PARTY: "false"
      ACCEPT_UNKNOWN_SELLER: "false"
      # Remind again while still in stock (each run is ~15 min apart)
      # Alert on the first sighting; the double-check follows (a "false alarm" note if it fails).
      FAST_ALERT: ${{ vars.FAST_ALERT || 'true' }}
      # Faster double-check (the re-check itself takes ~6 s)
      VERIFICATION_DELAY_SECONDS: ${{ vars.VERIFICATION_DELAY_SECONDS || '2' }}
      RESTOCK_REMINDER_MINUTES: ${{ vars.RESTOCK_REMINDER_MINUTES || '10' }}
      RESTOCK_REMINDER_MAX: ${{ vars.RESTOCK_REMINDER_MAX || '6' }}
      # Minimum gap between page loads at one retailer (the rate limiter).
      MIN_REQUEST_INTERVAL_SECONDS: ${{ vars.MIN_REQUEST_INTERVAL_SECONDS || '3' }}
      # Walmart blocks fast checking: one Walmart product per sweep, taking turns.
      CHECKS_PER_SWEEP: ${{ vars.CHECKS_PER_SWEEP || 'walmart=1' }}
      # ...and never more often than once a minute, however fast Target is checked.
      MIN_CHECK_GAP_SECONDS: ${{ vars.MIN_CHECK_GAP_SECONDS || 'walmart=60' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pokemon-restock-monitor/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Install browser (only if TARGET_USE_BROWSER=true)
        if: env.TARGET_USE_BROWSER == 'true'
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Check that a notification channel is configured
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ] && [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Add a DISCORD_WEBHOOK_URL or NTFY_TOPIC secret (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Send test notification
        if: inputs.test_notification
        run: python scripts/test_notifications.py --retailer "${{ inputs.test_retailer || 'target' }}"

      - name: Diagnose (capture product pages)
        if: inputs.diagnose
        env:
          SKUS: ${{ inputs.diagnose_sku || '1010892076' }}
          RETAILER: ${{ inputs.diagnose_retailer || 'target' }}
        run: |
          for sku in $(echo "$SKUS" | tr ',' ' '); do
            python scripts/capture_page.py --retailer "$RETAILER" --sku "$sku" --out "diag/$sku" > /dev/null || true
            echo "===== SUMMARY $RETAILER $sku ====="
            head -c 20000 "diag/$sku/summary.txt" || true
            echo
            # Walmart blocks quick bursts of page loads; space them out.
            if [ "$RETAILER" = "walmart" ]; then sleep 30; fi
          done

      - name: Upload diagnostics
        if: inputs.diagnose
        uses: actions/upload-artifact@v4
        with:
          name: target-page-diagnostics
          path: pokemon-restock-monitor/diag/
          retention-days: 3

      - name: Live end-to-end test (scratch database)
        if: ${{ inputs.live_test_tcins != '' && inputs.live_test_tcins != null }}
        env:
          TCINS: ${{ inputs.live_test_tcins }}
          RETAILER: ${{ inputs.live_test_retailer || 'target' }}
          DATABASE_URL: sqlite:////tmp/live-test.db
        run: |
          printf 'name,retailer,sku\n' > /tmp/live-test.csv
          for t in $(echo "$TCINS" | tr ',' ' '); do printf 'Live test item %s,%s,%s\n' "$t" "$RETAILER" "$t" >> /tmp/live-test.csv; done
          cat /tmp/live-test.csv
          python -m app.main --once --test-run --catalog /tmp/live-test.csv \
            --loop-minutes "${{ inputs.live_test_minutes || '0' }}" \
            --sweep-seconds "${{ vars.SWEEP_SECONDS || '30' }}" --concurrency "${{ vars.CHECK_CONCURRENCY || '3' }}"

      - name: Restore saved state
        if: ${{ !inputs.test_notification && !inputs.diagnose && !inputs.live_test_tcins }}
        run: |
          mkdir -p data
          if git fetch --depth=1 origin monitor-state 2>/dev/null; then
            git show origin/monitor-state:restock.db > data/restock.db
            echo "Restored state from monitor-state branch"
          else
            echo "No saved state yet (first run)"
          fi

      - name: Check stock
        if: ${{ !inputs.test_notification && !inputs.diagnose && !inputs.live_test_tcins }}
        run: >-
          python -m app.main --once --catalog catalog/target_30th_celebration.csv
          --catalog catalog/walmart_30th_celebration.csv
          --loop-minutes "${{ vars.LOOP_MINUTES || '20' }}"
          --sweep-seconds "${{ vars.SWEEP_SECONDS || '30' }}"
          --concurrency "${{ vars.CHECK_CONCURRENCY || '3' }}"

      - name: Save state
        if: ${{ always() && !inputs.test_notification && !inputs.diagnose && !inputs.live_test_tcins && hashFiles('pokemon-restock-monitor/data/restock.db') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          cp data/restock.db "$tmp/restock.db"
          cd "$tmp"
          git init -q -b monitor-state
          git add restock.db
          git -c user.name="restock-monitor" -c user.email="restock-monitor@users.noreply.github.com" \
            commit -q -m "Monitor state $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" monitor-state

      - name: Queue the next run (keeps monitoring continuous)
        if: >-
          ${{ always() && !cancelled() && !inputs.test_notification && !inputs.diagnose
          && !inputs.live_test_tcins && vars.MONITOR_ENABLED != 'false'
          && github.ref_name == github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            # Don't spin on a persistent failure: wait before trying again.
            echo "Run did not succeed ($JOB_STATUS); waiting 10 minutes before queueing the next run"
            sleep 600
          fi
          gh workflow run pokemon-restock-monitor.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "Next run queued"
